<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us</title>
  <link rel="stylesheet" href="contact.css"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-4">Contact Us</h1>
    <p class="text-center mb-5">Have questions or suggestions? Reach out to us below!</p>

    <div class="row justify-content-center">
      <div class="col-md-8">
        <form id="contact-form">
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="Your name" required />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Your Message</label>
            <textarea id="message" class="form-control" rows="5" placeholder="Type your message here..." required></textarea>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-primary">Send Message</button>
          </div>
        </form>
        <!-- Confirmation Modal -->
        <div class="modal" id="confirmation-modal">
            <div class="modal-content position-relative">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>Thank you!</h2>
            <p>Your message has been sent successfully.</p>
            </div>
        </div>
  
        <div class="text-center mt-4">
          <a href="index.html" class="btn btn-success">← Back to Home</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    const form = document.getElementById('contact-form');
    const modal = document.getElementById('confirmation-modal');
    const closeBtn = document.getElementById('close-modal');
  
    form.addEventListener('submit', function(e) {
      e.preventDefault(); // Prevent actual form submission
      modal.style.display = 'block'; // Show the modal
      form.reset(); // Clear the form fields (optional)
      setTimeout(() => modal.style.display = 'none', 3000);

    });
  
    closeBtn.onclick = function() {
      modal.style.display = 'none'; // Close modal on clicking the X
    };
  
    // Close modal when clicking outside the modal content
    window.onclick = function(e) {
      if (e.target === modal) {
        modal.style.display = 'none';
      }
    };
  </script>
  
</body>
</html>
